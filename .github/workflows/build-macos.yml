name: Build Mac version

on:
  push:
    branches: ['full-send-comp/macos']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-arm64:
    runs-on: macos-26
    steps:
      - name: Check out HarmonyRecomp
        uses: actions/checkout@v4

      - name: Check out the Harmony ReXGlue runtime (Mac line)
        uses: actions/checkout@v4
        with:
          ref: rexglue-sdk/macos
          path: _deps/rexglue-sdk
          submodules: recursive

      - name: Install build tools
        run: |
          brew install ninja openssl@3
          xcrun clang++ --version

      - name: Configure
        run: |
          cmake --preset mac-arm64-relwithdebinfo \
            -DREXSDK_DIR="$GITHUB_WORKSPACE/_deps/rexglue-sdk" \
            -DREXGLUE_USE_PREGENERATED=ON \
            -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DOPENSSL_USE_STATIC_LIBS=ON

      - name: Build
        run: |
          build_dir=out/build/mac-arm64-relwithdebinfo
          cmake --build "$build_dir" --target harmonyrecomp harmonyrecomp-import harmonyrecomp-dlc-import --parallel
          echo "BUILD_DIR=$build_dir" >> "$GITHUB_ENV"

      - name: Check the app depends only on macOS libraries
        run: |
          otool -L "$BUILD_DIR/harmonyrecomp"
          if otool -L "$BUILD_DIR/harmonyrecomp" | grep -E '/opt/homebrew|/usr/local/'; then
            echo "harmonyrecomp links a Homebrew library" >&2
            exit 1
          fi

      - name: Package the app
        run: |
          mkdir -p dist
          tools/macos/package_app.sh "$BUILD_DIR" dist

      - name: Upload Mac build
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyRecomp-macos-arm64
          path: dist/HarmonyRecomp-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
