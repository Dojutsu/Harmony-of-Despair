name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: [self-hosted, linux, x64, buildserver]
    steps:
      - name: Synchronize the clean server checkout
        shell: bash
        run: |
          repo=/srv/ai/workspaces/codex/HarmonyRecomp
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" fetch origin master
          test "$(git -C "$repo" rev-parse origin/master)" = "$GITHUB_SHA"
          git -C "$repo" checkout master
          git -C "$repo" merge --ff-only origin/master

      - name: Build
        run: /home/owner/test-harmony-codex-build.sh

      - name: Restore generated build outputs
        shell: bash
        run: |
          repo=/srv/ai/workspaces/codex/HarmonyRecomp
          git -C "$repo" restore --worktree -- generated
          test -z "$(git -C "$repo" status --porcelain)"

      - name: Package
        shell: bash
        run: |
          build=/srv/ai/workspaces/codex/HarmonyRecomp/out/build/linux-amd64-relwithdebinfo
          runtime=/srv/ai/build-cache/HarmonyRecomp/rexglue-out/linux-amd64
          rm -rf dist
          mkdir -p dist/HarmonyRecomp-linux-amd64
          cp "$build/harmonyrecomp" \
            "$build/harmonyrecomp-import" \
            "$build/libharmonyrecomp_dllAlucard.so" \
            "$build/libharmonyrecomp_dllAxeArmor.so" \
            "$build/libharmonyrecomp_dllCharlotte.so" \
            "$build/libharmonyrecomp_dllJonathan.so" \
            "$build/libharmonyrecomp_dllShanoa.so" \
            "$build/libharmonyrecomp_dllSoma.so" \
            "$build/librexgpu-xenosrd.so" \
            "$runtime/librexruntimerd.so" "$runtime/libTracyClientrd.so" \
            dist/HarmonyRecomp-linux-amd64/
          if find dist -type f \( -iname '*.xex' -o -iname '*.dll' \) -print -quit | grep -q .; then
            echo "Refusing to package private game inputs" >&2
            exit 1
          fi
          tar -C dist -czf dist/HarmonyRecomp-linux-amd64.tar.gz HarmonyRecomp-linux-amd64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyRecomp-linux-amd64
          path: dist/HarmonyRecomp-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/HarmonyRecomp-linux-amd64.tar.gz --generate-notes

  windows-amd64:
    runs-on: windows-2022
    steps:
      - name: Check out HarmonyRecomp
        uses: actions/checkout@v4

      - name: Check out the pinned ReXGlue release
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: c94f5ebdcb3c9d1a460ca48e04f9758448f8d518
          path: _deps/rexglue-sdk
          submodules: recursive

      - name: Apply the reviewed Harmony ReXGlue delta
        shell: pwsh
        run: |
          git -C _deps/rexglue-sdk config core.autocrlf false
          git -C _deps/rexglue-sdk reset --hard HEAD
          git -C _deps/rexglue-sdk apply --check ../../thirdparty/patches/rexglue-harmony-online-directory.patch
          git -C _deps/rexglue-sdk apply ../../thirdparty/patches/rexglue-harmony-online-directory.patch

      - name: Install the established Windows toolchain
        shell: pwsh
        run: choco install llvm cmake ninja -y

      - name: Configure
        shell: pwsh
        run: cmake --preset win-amd64-relwithdebinfo -DREXSDK_DIR="$env:GITHUB_WORKSPACE/_deps/rexglue-sdk" -DREXGLUE_USE_PREGENERATED=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset win-amd64-relwithdebinfo --target harmonyrecomp --parallel
          cmake --build --preset win-amd64-relwithdebinfo --target harmonyrecomp-import --parallel
          cmake --build --preset win-amd64-relwithdebinfo --target harmonyrecomp-dlc-import --parallel
          cmake --build --preset win-amd64-relwithdebinfo --target sha256_tests --parallel

      - name: Stage Microsoft application-local runtime
        shell: pwsh
        run: |
          $build = 'out/build/win-amd64-relwithdebinfo'
          $runtimeNames = @(
            'MSVCP140.dll',
            'MSVCP140_ATOMIC_WAIT.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          )
          $crtDirectories = @()
          if ($env:VCToolsRedistDir) {
            $crtDirectories += Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (Test-Path -LiteralPath $vswhere -PathType Leaf) {
            $installation = & $vswhere -latest -property installationPath
            $redistRoot = Join-Path $installation 'VC/Redist/MSVC'
            $crtDirectories += Get-ChildItem -LiteralPath $redistRoot -Directory -Recurse |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]Microsoft\.VC143\.CRT$' } |
              Sort-Object FullName -Descending |
              ForEach-Object FullName
          }
          $crtDirectories += Join-Path $env:WINDIR 'System32'
          $crtDirectory = $crtDirectories | Where-Object {
            $candidate = $_
            (Test-Path -LiteralPath $candidate -PathType Container) -and
              -not ($runtimeNames | Where-Object {
                -not (Test-Path -LiteralPath (Join-Path $candidate $_) -PathType Leaf)
              })
          } | Select-Object -First 1
          if (!$crtDirectory) {
            throw 'No coherent Microsoft VC143 x64 application-local runtime set was found.'
          }
          Write-Host "Staging Microsoft application-local runtime from $crtDirectory"
          foreach ($name in $runtimeNames) {
            Copy-Item -LiteralPath (Join-Path $crtDirectory $name) -Destination $build -Force
          }

          $tracyDestination = Join-Path $build 'TracyClientrd.dll'
          if (!(Test-Path -LiteralPath $tracyDestination -PathType Leaf)) {
            $tracySource = Get-ChildItem -LiteralPath $build -Filter 'TracyClientrd.dll' -Recurse -File |
              Select-Object -First 1 -ExpandProperty FullName
            if (!$tracySource) {
              throw 'The built TracyClientrd.dll dependency was not found.'
            }
            Copy-Item -LiteralPath $tracySource -Destination $tracyDestination -Force
          }

      - name: Test importer validation
        shell: pwsh
        run: |
          $build = 'out/build/win-amd64-relwithdebinfo'
          cmake --build --preset win-amd64-relwithdebinfo --target game_data_tests sha256_tests dlc_header_tests --parallel
          ctest --test-dir $build --verbose --output-on-failure
          $missingData = Join-Path $env:RUNNER_TEMP 'missing-harmony-data'
          $verify = Start-Process `
            -FilePath "$build/harmonyrecomp-import.exe" `
            -ArgumentList @('--verify', $missingData) `
            -Wait `
            -PassThru `
            -NoNewWindow
          if ($verify.ExitCode -eq 0) {
            throw 'Importer unexpectedly accepted a missing installation.'
          }

      - name: Package explicit redistributable allowlist
        shell: pwsh
        run: |
          $build = 'out/build/win-amd64-relwithdebinfo'
          $root = 'dist/HarmonyRecomp-windows-amd64'
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $required = @(
            'harmonyrecomp.exe',
            'harmonyrecomp-import.exe',
            'harmonyrecomp-dlc-import.exe',
            'harmonyrecomp_dllAlucard.dll',
            'harmonyrecomp_dllAxeArmor.dll',
            'harmonyrecomp_dllCharlotte.dll',
            'harmonyrecomp_dllJonathan.dll',
            'harmonyrecomp_dllShanoa.dll',
            'harmonyrecomp_dllSoma.dll',
            'rexgpu-xenosrd.dll',
            'rexruntimerd.dll',
            'TracyClientrd.dll',
            'MSVCP140.dll',
            'MSVCP140_ATOMIC_WAIT.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          )
          foreach ($name in $required) {
            $source = Join-Path $build $name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required Windows runtime file is missing: $name"
            }
            Copy-Item -LiteralPath $source -Destination $root
          }
          Copy-Item -LiteralPath README.md -Destination $root

          $allowed = @($required + 'README.md')
          $actual = @(Get-ChildItem -LiteralPath $root -File | ForEach-Object Name)
          $unexpected = @($actual | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $actual })
          if ($unexpected.Count -or $missing.Count) {
            throw "Release allowlist mismatch. Unexpected: $unexpected Missing: $missing"
          }

          $forbidden = @(Get-ChildItem -LiteralPath dist -Recurse -File | Where-Object {
            $_.Extension -ieq '.xex' -or
            $_.Name -iin @('default.xex', 'dllAlucard.dll', 'dllAxeArmor.dll',
              'dllCharlotte.dll', 'dllJonathan.dll', 'dllShanoa.dll', 'dllSoma.dll')
          })
          if ($forbidden.Count) {
            throw "Refusing to package original game input: $($forbidden.FullName)"
          }

          Compress-Archive -LiteralPath $root -DestinationPath 'dist/HarmonyRecomp-windows-amd64.zip'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyRecomp-windows-amd64
          path: dist/HarmonyRecomp-windows-amd64.zip
          if-no-files-found: error
