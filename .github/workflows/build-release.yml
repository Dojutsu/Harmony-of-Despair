name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    # BuildServer builds and tests the Linux package itself (Full-Send-Comp
    # scripts/build.sh + package.sh in the pinned Steam Runtime 4 carrier); the
    # runner only publishes the package BuildServer last verified. /releases is the
    # read-only mount of Full-Send-Comp/build/release-linux on BuildServer.
    runs-on: [self-hosted, linux, x64, buildserver]
    steps:
      - name: Collect the verified BuildServer Linux package
        shell: bash
        run: |
          set -euo pipefail
          src=/releases
          test -f "$src/latest.tar.gz" -a -f "$src/latest.tar.gz.sha256" -a -f "$src/latest.receipt.json"
          rm -rf dist
          mkdir -p dist
          cp -L "$src/latest.tar.gz" dist/HarmonyRecomp-linux-amd64.tar.gz
          cp -L "$src/latest.receipt.json" dist/HarmonyRecomp-linux-amd64.receipt.json
          expected=$(cut -d' ' -f1 "$src/latest.tar.gz.sha256")
          echo "$expected  dist/HarmonyRecomp-linux-amd64.tar.gz" | sha256sum -c -
          if tar -tzf dist/HarmonyRecomp-linux-amd64.tar.gz | grep -i -E '\.(xex|xexp|dllp|dll)$|savedata\.dat$|\.hpli$' | grep -q .; then
            echo "Refusing to package private game inputs" >&2
            exit 1
          fi
          echo "Publishing $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["build_id"])' dist/HarmonyRecomp-linux-amd64.receipt.json 2>/dev/null || cat dist/HarmonyRecomp-linux-amd64.receipt.json)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyRecomp-linux-amd64
          path: |
            dist/HarmonyRecomp-linux-amd64.tar.gz
            dist/HarmonyRecomp-linux-amd64.receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HarmonyRecomp-linux-amd64.tar.gz
            dist/HarmonyRecomp-linux-amd64.receipt.json
          generate_release_notes: true

  windows-amd64:
    runs-on: windows-2022
    steps:
      - name: Check out HarmonyRecomp
        uses: actions/checkout@v4

      - name: Check out the Harmony ReXGlue runtime line
        uses: actions/checkout@v4
        with:
          ref: fb9c9439f6f4423d2c204a361f8585a7faed57ef
          path: _deps/rexglue-sdk
          submodules: recursive

      - name: Install the established Windows toolchain
        shell: pwsh
        run: |
          choco install llvm --version=22.1.8 -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install cmake ninja -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          $version = & "$llvm/clang++.exe" --version
          if ($LASTEXITCODE -ne 0 -or ($version -join ' ') -notmatch 'clang version 22\.1\.8\b') {
            throw 'The Windows build requires LLVM/Clang 22.1.8.'
          }
          cmake --preset win-amd64-relwithdebinfo -DREXSDK_DIR="$env:GITHUB_WORKSPACE/_deps/rexglue-sdk" -DREXGLUE_USE_PREGENERATED=ON "-DCMAKE_C_COMPILER=$llvm/clang.exe" "-DCMAKE_CXX_COMPILER=$llvm/clang++.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset win-amd64-relwithdebinfo --target harmonyrecomp --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset win-amd64-relwithdebinfo --target harmonyrecomp-import --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset win-amd64-relwithdebinfo --target harmonyrecomp-dlc-import --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset win-amd64-relwithdebinfo --target sha256_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage Windows application-local runtime
        shell: pwsh
        run: |
          $build = 'out/build/win-amd64-relwithdebinfo'
          $runtimeNames = @(
            'MSVCP140.dll',
            'MSVCP140_ATOMIC_WAIT.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          )
          $crtDirectories = @()
          if ($env:VCToolsRedistDir) {
            $crtDirectories += Join-Path $env:VCToolsRedistDir 'x64/Microsoft.VC143.CRT'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (Test-Path -LiteralPath $vswhere -PathType Leaf) {
            $installation = & $vswhere -latest -property installationPath
            $redistRoot = Join-Path $installation 'VC/Redist/MSVC'
            $crtDirectories += Get-ChildItem -LiteralPath $redistRoot -Directory -Recurse |
              Where-Object { $_.FullName -match '[\\/]x64[\\/]Microsoft\.VC143\.CRT$' } |
              Sort-Object FullName -Descending |
              ForEach-Object FullName
          }
          $crtDirectories += Join-Path $env:WINDIR 'System32'
          $crtDirectory = $crtDirectories | Where-Object {
            $candidate = $_
            (Test-Path -LiteralPath $candidate -PathType Container) -and
              -not ($runtimeNames | Where-Object {
                -not (Test-Path -LiteralPath (Join-Path $candidate $_) -PathType Leaf)
              })
          } | Select-Object -First 1
          if (!$crtDirectory) {
            throw 'No coherent Microsoft VC143 x64 application-local runtime set was found.'
          }
          Write-Host "Staging Microsoft application-local runtime from $crtDirectory"
          foreach ($name in $runtimeNames) {
            Copy-Item -LiteralPath (Join-Path $crtDirectory $name) -Destination $build -Force
          }

          $sdkRuntime = Join-Path $env:GITHUB_WORKSPACE '_deps/rexglue-sdk/out/win-amd64'
          foreach ($name in @('rexruntimerd.dll', 'TracyClientrd.dll')) {
            $source = Join-Path $sdkRuntime $name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "The built ReXGlue runtime dependency was not found: $name"
            }
            Copy-Item -LiteralPath $source -Destination $build -Force
          }

      - name: Test importer validation
        shell: pwsh
        run: |
          $build = 'out/build/win-amd64-relwithdebinfo'
          cmake --build --preset win-amd64-relwithdebinfo --target game_data_tests sha256_tests dlc_header_tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $build --verbose --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $missingData = Join-Path $env:RUNNER_TEMP 'missing-harmony-data'
          $verify = Start-Process `
            -FilePath "$build/harmonyrecomp-import.exe" `
            -ArgumentList @('--verify', $missingData) `
            -Wait `
            -PassThru `
            -NoNewWindow
          if ($verify.ExitCode -eq 0) {
            throw 'Importer unexpectedly accepted a missing installation.'
          }

      - name: Test canonical Windows launcher
        shell: powershell
        run: |
          & .\tools\test_launcher.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\test_online_companion.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package explicit redistributable allowlist
        shell: pwsh
        run: |
          $build = 'out/build/win-amd64-relwithdebinfo'
          $root = 'dist/HarmonyRecomp-windows-amd64'
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $moduleAllowlistPath = 'generated/default/windows_runtime_modules.txt'
          $moduleNames = @(Get-Content -LiteralPath $moduleAllowlistPath |
            Where-Object { $_ -and !$_.StartsWith('#') })
          $generatedModuleNames = @(Get-Content -LiteralPath 'generated/default/dll_targets.cmake' |
            ForEach-Object {
              if ($_ -match '^\s*add_library\((harmonyrecomp_\S+) SHARED') {
                "$($Matches[1]).dll"
              }
            })
          if ($moduleNames.Count -ne 116 -or
              @($moduleNames | Sort-Object -Unique).Count -ne $moduleNames.Count) {
            throw 'The explicit Windows recompiled-module allowlist must contain 116 unique entries.'
          }
          $missingModules = @($generatedModuleNames | Where-Object { $_ -notin $moduleNames })
          $unexpectedModules = @($moduleNames | Where-Object { $_ -notin $generatedModuleNames })
          if ($missingModules.Count -or $unexpectedModules.Count) {
            throw "Generated module allowlist mismatch. Missing: $missingModules Unexpected: $unexpectedModules"
          }

          $required = @(
            'harmonyrecomp.exe',
            'harmonyrecomp-import.exe',
            'harmonyrecomp-dlc-import.exe'
          ) + $moduleNames + @(
            'rexgpu-xenosrd.dll',
            'rexruntimerd.dll',
            'TracyClientrd.dll',
            'MSVCP140.dll',
            'MSVCP140_ATOMIC_WAIT.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          )
          foreach ($name in $required) {
            $source = Join-Path $build $name
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Required Windows runtime file is missing: $name"
            }
            Copy-Item -LiteralPath $source -Destination $root
          }
          $publicFiles = @(
            'README.md',
            'Launch-Harmony.bat',
            'Join-Harmony.ps1',
            'Setup-Harmony.ps1',
            'Online-Harmony.ps1',
            'harmonyrecomp-user.example.cfg'
          )
          foreach ($name in $publicFiles) {
            Copy-Item -LiteralPath $name -Destination $root
          }

          $allowed = @($required + $publicFiles)
          $actual = @(Get-ChildItem -LiteralPath $root -File | ForEach-Object Name)
          $unexpected = @($actual | Where-Object { $_ -notin $allowed })
          $missing = @($allowed | Where-Object { $_ -notin $actual })
          if ($unexpected.Count -or $missing.Count) {
            throw "Release allowlist mismatch. Unexpected: $unexpected Missing: $missing"
          }

          $forbidden = @(Get-ChildItem -LiteralPath dist -Recurse -File | Where-Object {
            $_.Extension -iin @('.xex', '.xexp', '.dllp') -or
            $_.Name -ieq 'savedata.dat' -or
            $_.Name -iin @('default.xex', 'dllAlucard.dll', 'dllAxeArmor.dll',
              'dllCharlotte.dll', 'dllJonathan.dll', 'dllShanoa.dll', 'dllSoma.dll')
          })
          if ($forbidden.Count) {
            throw "Refusing to package original game input: $($forbidden.FullName)"
          }

          Compress-Archive -LiteralPath $root -DestinationPath 'dist/HarmonyRecomp-windows-amd64.zip'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyRecomp-windows-amd64
          path: dist/HarmonyRecomp-windows-amd64.zip
          if-no-files-found: error
          retention-days: 7
