name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: [self-hosted, linux, x64, buildserver]
    steps:
      - name: Synchronize the clean server checkout
        shell: bash
        run: |
          repo=/srv/ai/workspaces/codex/HarmonyRecomp
          test -z "$(git -C "$repo" status --porcelain)"
          git -C "$repo" fetch github master
          test "$(git -C "$repo" rev-parse github/master)" = "$GITHUB_SHA"
          git -C "$repo" checkout master
          git -C "$repo" merge --ff-only github/master

      - name: Build
        run: /home/owner/test-harmony-codex-build.sh

      - name: Package
        shell: bash
        run: |
          build=/srv/ai/workspaces/codex/HarmonyRecomp/out/build/linux-amd64-relwithdebinfo
          runtime=/srv/ai/build-cache/HarmonyRecomp/rexglue-out/linux-amd64
          mkdir -p dist/HarmonyRecomp-linux-amd64
          cp "$build/harmonyrecomp" "$build/librexgpu-xenosrd.so" \
            "$runtime/librexruntimerd.so" "$runtime/libTracyClientrd.so" \
            dist/HarmonyRecomp-linux-amd64/
          tar -C dist -czf dist/HarmonyRecomp-linux-amd64.tar.gz HarmonyRecomp-linux-amd64

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HarmonyRecomp-linux-amd64
          path: dist/HarmonyRecomp-linux-amd64.tar.gz
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/HarmonyRecomp-linux-amd64.tar.gz --generate-notes
