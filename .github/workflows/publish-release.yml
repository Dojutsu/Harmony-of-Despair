name: Attach builds to a release

# Run by hand after the builds are green: creates the release (notes from
# .github/release-notes/<tag>.md) if it doesn't exist yet, then copies the
# packages from finished workflow runs and an optional iOS release onto it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the packages go on
        required: true
      title:
        description: Release title (used only when the release is created)
        required: false
        default: ''
      ios_tag:
        description: Release tag whose iPhone/iPad .ipa is copied over (optional)
        required: false
        default: ''
      build_run:
        description: Run id of "Build and release" (Windows and Linux packages)
        required: true
      mac_run:
        description: Run id of "Build Mac version" (optional)
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes

      - name: Download the Windows and Linux packages
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Download the Mac package
        if: inputs.mac_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.mac_run }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true

      - name: Copy the iPhone/iPad package
        if: inputs.ios_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_TAG: ${{ inputs.ios_tag }}
        run: gh release download "$IOS_TAG" -p '*.ipa' -D dist -R "$GITHUB_REPOSITORY"

      - name: Refuse private game inputs
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          cat dist/*.receipt.json 2>/dev/null || true
          for zip in dist/*.zip; do
            if unzip -Z1 "$zip" | grep -i -E '\.(xex|xexp|dllp)$|savedata\.dat$|\.hpli$|default\.xex$' | grep -q .; then
              echo "Refusing to publish private game inputs in $zip" >&2
              exit 1
            fi
          done
          for tarball in dist/*.tar.gz; do
            if tar -tzf "$tarball" | grep -i -E '\.(xex|xexp|dllp|dll)$|savedata\.dat$|\.hpli$' | grep -q .; then
              echo "Refusing to publish private game inputs in $tarball" >&2
              exit 1
            fi
          done

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            notes=".github/release-notes/$TAG.md"
            test -f "$notes"
            gh release create "$TAG" --target "$GITHUB_SHA" --title "${TITLE:-$TAG}" \
              --notes-file "$notes" -R "$GITHUB_REPOSITORY"
          fi
          gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
