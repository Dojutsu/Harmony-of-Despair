# Optional advanced settings. Copy this file to harmonyrecomp-user.cfg only if
# you want to override the defaults; ordinary first-run setup needs no config.
HARMONY_GPU_PLUGIN=xenos
HARMONY_MNK_MODE=true
HARMONY_LICENSE_MASK=1

# Leave identity values empty to use HarmonyRecomp defaults.
HARMONY_USER_XUID=
HARMONY_USER_NAME=

# Change these only when collecting a diagnostic log.
HARMONY_LOG_LEVEL=info
HARMONY_LOG_NOISY=false
