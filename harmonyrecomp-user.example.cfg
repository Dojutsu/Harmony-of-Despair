# Optional advanced settings. Copy this file to harmonyrecomp-user.cfg only if
# you want to override the defaults; ordinary first-run setup needs no config.
HARMONY_GPU_PLUGIN=xenos
HARMONY_MNK_MODE=true
HARMONY_LICENSE_MASK=1

# A random, persistent player XUID is created automatically in
# %LOCALAPPDATA%\HarmonyRecomp\launcher-profile.cfg. Set either value only to
# override that identity. XUID is a non-secret unsigned decimal value; bits 54
# and 55 must be clear. Process environment values take priority over this file.
HARMONY_USER_XUID=
HARMONY_USER_NAME=

# Public multiplayer uses the production directory automatically. Advanced
# deployments may override these settings; an empty URL disables the directory
# without disabling LAN multiplayer.
HARMONY_SESSION_DIRECTORY_URL=https://hod.dojutsu.net
HARMONY_SESSION_DIRECTORY_CANDIDATE_TYPE=public

# These are the normal LAN/public-online settings. Machine-specific bind
# addresses and manual Direct Connect remain development command-line options.
HARMONY_LAN_ONLINE=true
HARMONY_LAN_DISCOVERY_PORT=30741
HARMONY_LAN_GAMEPLAY_PORT=30742

# Change these only when collecting a diagnostic log.
HARMONY_LOG_LEVEL=info
HARMONY_LOG_NOISY=false
